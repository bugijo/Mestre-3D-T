name: iOS Alpha Build Check

# Valida que o código iOS (Capacitor) compila para o Simulator no macOS.
# NÃO assina, NÃO publica, NÃO usa Apple Developer.
on:
  push:
    branches: ["mobile-alpha"]
  workflow_dispatch:

jobs:
  ios-build:
    name: Build iOS Simulator
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web (mobile mode)
        run: npm run build:mobile

      - name: Capacitor sync iOS
        run: npx cap sync ios

      - name: List Xcode / SDKs
        run: |
          xcodebuild -version
          xcodebuild -showsdks

      - name: Build iOS for Simulator (no signing)
        run: |
          cd ios/App
          xcodebuild -project App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
        env:
          # Sem credenciais Apple — build de simulação não exige assinatura
          DEVELOPER_DIR: ""

      - name: Verify app bundle
        run: |
          APP_BUNDLE=$(find ios/App/build/Build/Products -name "*.app" -maxdepth 2 | head -1)
          echo "Bundle: $APP_BUNDLE"
          test -n "$APP_BUNDLE"
          ls -la "$APP_BUNDLE"

      - name: Upload app bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: RPG-Alpha-iOS-Simulator
          path: ios/App/build/Build/Products/Debug-iphonesimulator/*.app
          if-no-files-found: error
          retention-days: 7

      - name: List available simulators
        run: |
          xcrun simctl list devices available

      - name: Create and boot iPhone Simulator
        run: |
          # Use iPhone 16 with iOS 18 (available on macos-15)
          SIMULATOR_ID=$(xcrun simctl create "RPG-Test-iPhone" "com.apple.CoreSimulator.SimDeviceType.iPhone-16" "com.apple.CoreSimulator.SimRuntime.iOS-18-0")
          echo "Created simulator: $SIMULATOR_ID"
          xcrun simctl boot "$SIMULATOR_ID"
          # Wait for boot
          sleep 10
          xcrun simctl bootstatus "$SIMULATOR_ID"

      - name: Install app on Simulator
        run: |
          APP_BUNDLE=$(find ios/App/build/Build/Products -name "*.app" -maxdepth 2 | head -1)
          echo "Installing: $APP_BUNDLE"
          xcrun simctl install "$SIMULATOR_ID" "$APP_BUNDLE"

      - name: Launch app on Simulator
        run: |
          xcrun simctl launch "$SIMULATOR_ID" com.bugijo.rpgalpha
          # Wait for app to start
          sleep 5

      - name: Capture screenshot
        run: |
          xcrun simctl io "$SIMULATOR_ID" screenshot screenshot.png
          ls -la screenshot.png

      - name: Collect Simulator logs
        run: |
          xcrun simctl spawn "$SIMULATOR_ID" log collect --output logarchive --start "$(date -v-1M '+%Y-%m-%d %H:%M:%S')" || true
          echo "Log collection completed"

      - name: Upload screenshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: iOS-Simulator-screenshot
          path: screenshot.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Shutdown simulator
        if: always()
        run: |
          xcrun simctl shutdown "$SIMULATOR_ID" || true
          xcrun simctl delete "$SIMULATOR_ID" || true
