name: iOS Alpha Build Check

# Valida que o código iOS (Capacitor) compila para o Simulator no macOS.
# NÃO assina, NÃO publica, NÃO usa Apple Developer.
on:
  push:
    branches: ["mobile-alpha"]
  workflow_dispatch:

jobs:
  ios-build:
    name: Build iOS Simulator
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web (mobile mode)
        run: npm run build:mobile

      - name: Capacitor sync iOS
        run: npx cap sync ios

      - name: List Xcode / SDKs
        run: |
          xcodebuild -version
          xcodebuild -showsdks

      - name: Build iOS for Simulator (no signing)
        run: |
          cd ios/App
          xcodebuild -project App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
        env:
          # Sem credenciais Apple — build de simulação não exige assinatura
          DEVELOPER_DIR: ""

      - name: Verify app bundle
        run: |
          APP_BUNDLE=$(find ios/App/build/Build/Products -name "*.app" -maxdepth 2 | head -1)
          echo "Bundle: $APP_BUNDLE"
          test -n "$APP_BUNDLE"
          ls -la "$APP_BUNDLE"

      - name: Upload app bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: RPG-Alpha-iOS-Simulator
          path: ios/App/build/Build/Products/Debug-iphonesimulator/*.app
          if-no-files-found: error
          retention-days: 7

      - name: List available simulators
        run: |
          xcrun simctl list devices available

      - name: Create and boot iPhone Simulator
        run: |
          # Use existing available simulators instead of creating new ones
          echo "=== Available simulators ==="
          xcrun simctl list devices available -j > available_simulators.json
          
          # Find first available iPhone 16/16 Pro/15/15 Pro simulator that is booted or shutdown (not unavailable)
          SIMULATOR_ID=$(cat available_simulators.json | jq -r '
            .devices | to_entries[] | .value[] | 
            select(.name | test("iPhone (16|15|14)")) | 
            select(.state != "Unavailable") | 
            .udid
          ' | head -1)
          
          if [ -z "$SIMULATOR_ID" ] || [ "$SIMULATOR_ID" = "null" ]; then
            echo "No iPhone 16/15/14 simulator found, trying any available iPhone..."
            SIMULATOR_ID=$(cat available_simulators.json | jq -r '
              .devices | to_entries[] | .value[] | 
              select(.name | test("iPhone")) | 
              select(.state != "Unavailable") | 
              .udid
            ' | head -1)
          fi
          
          if [ -z "$SIMULATOR_ID" ] || [ "$SIMULATOR_ID" = "null" ]; then
            echo "ERROR: No available iPhone simulator found"
            cat available_simulators.json
            exit 1
          fi
          
          echo "Using existing simulator: $SIMULATOR_ID"
          
          # Check current state
          STATE=$(cat available_simulators.json | jq -r --arg udid "$SIMULATOR_ID" '.devices | to_entries[] | .value[] | select(.udid == $udid) | .state')
          echo "Simulator state: $STATE"
          
          # Boot if needed
          if [ "$STATE" != "Booted" ]; then
            xcrun simctl boot "$SIMULATOR_ID"
            sleep 15
          else
            echo "Simulator already booted"
          fi
          
          xcrun simctl bootstatus "$SIMULATOR_ID"

      - name: Install app on Simulator
        run: |
          APP_BUNDLE=$(find ios/App/build/Build/Products -name "*.app" -maxdepth 2 | head -1)
          echo "Installing: $APP_BUNDLE"
          xcrun simctl install "$SIMULATOR_ID" "$APP_BUNDLE"

      - name: Launch app on Simulator
        run: |
          xcrun simctl launch "$SIMULATOR_ID" com.bugijo.rpgalpha
          # Wait for app to start
          sleep 5

      - name: Capture screenshot
        run: |
          xcrun simctl io "$SIMULATOR_ID" screenshot screenshot.png
          ls -la screenshot.png

      - name: Collect Simulator logs
        run: |
          xcrun simctl spawn "$SIMULATOR_ID" log collect --output logarchive --start "$(date -v-1M '+%Y-%m-%d %H:%M:%S')" || true
          echo "Log collection completed"

      - name: Upload screenshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: iOS-Simulator-screenshot
          path: screenshot.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Shutdown simulator
        if: always()
        run: |
          xcrun simctl shutdown "$SIMULATOR_ID" || true
          xcrun simctl delete "$SIMULATOR_ID" || true
